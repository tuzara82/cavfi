[profile.default]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
src = "src"
out = "out"
libs = ["lib"]

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/","forge-std/=lib/forge-std/src/","@redstone-finance/evm-connector/=vendor/redstone-evm-connector/"]
fs_permissions = [{ access = "read-write", path = "../site" }]

[rpc_endpoints]
dogeos = "https://rpc.testnet.dogeos.com"
